<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aida's Portfolio</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 680px;
      margin: 0 auto;
      padding: 32px 20px;
      line-height: 1.5;
      color: #111;
      background: #fff;
    }
    header {
      margin-bottom: 28px;
    }
    header h1 {
      margin: 0 0 4px;
      font-size: 1.5rem;
      font-weight: 700;
    }
    header .subtitle {
      margin: 0 0 10px;
      color: #555;
      font-size: 0.9rem;
    }
    nav {
      border-bottom: 1px solid #e5e5e5;
      padding-bottom: 12px;
    }
    nav a {
      margin-right: 14px;
      color: #2563eb;
      text-decoration: none;
      font-size: 0.95rem;
    }
    nav a:hover {
      text-decoration: underline;
    }
    section {
      margin-bottom: 36px;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 1.2rem;
      font-weight: 700;
    }
    h3 {
      margin: 18px 0 6px;
      font-size: 1rem;
      font-weight: 600;
    }
    .about-block {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .about-block img {
      width: 88px;
      height: 88px;
      border-radius: 10px;
      background: #e8e8e8;
      flex-shrink: 0;
    }
    details {
      margin-top: 10px;
    }
    summary {
      cursor: pointer;
      color: #2563eb;
    }
    ul {
      margin: 0 0 16px;
      padding-left: 22px;
    }
    progress, meter {
      width: 160px;
      height: 10px;
      vertical-align: middle;
    }
    audio, video {
      display: block;
      max-width: 100%;
      margin-top: 8px;
    }
    video {
      background: #111;
      border-radius: 6px;
    }
    form {
      margin-top: 8px;
    }
    fieldset {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 14px 16px 18px;
    }
    legend {
      font-weight: 600;
      padding: 0 6px;
    }
    label {
      display: block;
      margin-top: 12px;
      font-size: 0.95rem;
    }
    input[type="text"],
    input[type="email"],
    textarea {
      display: block;
      width: 100%;
      max-width: 280px;
      margin-top: 4px;
      padding: 6px
